# gitleaks configuration: the default rules plus an allowlist for two known test fixtures.
# Each entry is the exact fixture value (anchored), so no other string is excluded.
title = "card-checkout-store"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures that only look like secrets"
regexTarget = "secret"
regexes = [
  # Dummy AWS access key id used by the bundled Lambda boot test (api/test/build).
  '''^AKIAFAKEFAKEFAKEFAKE$''',
  # Alphabet used by fast-check to generate fake access key ids (api/test/infra).
  '''^0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$''',
]
